
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Wordle</title>
  <style>
    :root{
      --tile-size: 56px;
      --gap: 8px;
      --bg: #121213;
      --tile-bg: #1a1a1b;
      --text: #e6e6e6;
      --kbd-bg: #3a3a3c;
      --kbd-text: #fff;
      --correct: #6aaa64;   /* green */
      --present: #c9b458;   /* yellow */
	  --wrong: #7a7a7c;
      --absent:  #3a3a3c;   /* gray */
      --accent: #538d4e;
    }
    * { box-sizing: border-box; }
    body{
      margin: 0; font-family: system-ui,Segoe UI,Roboto,Helvetica,Arial;
      background: var(--bg); color: var(--text); display: grid;
      place-items: start center; min-height: 100vh;
    }
    header{
      width: 100%; text-align: center; border-bottom: 1px solid #2a2a2a;
      padding: 14px 0; font-weight: 700; letter-spacing: 0.04em;
    }
    .game{
      margin-top: 18px; display: grid; gap: 18px; width: min(520px, 92vw);
    }
    .board{
      display: grid; gap: var(--gap);
      grid-template-rows: repeat(6, var(--tile-size));
    }
    .row{
      display: grid; gap: var(--gap);
      grid-template-columns: repeat(5, var(--tile-size));
      justify-content: center;
    }
    .tile{
      width: var(--tile-size); height: var(--tile-size);
      display: grid; place-items: center;
      border: 2px solid #3a3a3c; background: var(--tile-bg);
      font-weight: 700; font-size: 1.6rem; text-transform: uppercase;
      user-select: none;
      transition: transform .08s ease, border-color .2s ease, background-color .2s ease;
    }
    .tile.filled{ border-color: #565758; }
    .tile.reveal{ animation: flip .5s ease forwards; }
    @keyframes flip{
      0%{ transform: rotateX(0) }
      49%{ transform: rotateX(90deg) }
      51%{ transform: rotateX(90deg) }
      100%{ transform: rotateX(0) }
    }
    .state-correct{ background: var(--correct) !important; border-color: var(--correct) !important; color: #fff; }
    .state-present{ background: var(--present) !important; border-color: var(--present) !important; color: #fff; }
	.state-wrong{ background: var(--wrong) !important; border-color: var(--wrong) !important; color: #fff; }
    .state-absent{ background: var(--absent)  !important; border-color: var(--absent)  !important; color: #fff; }

    .keyboard{
      display: grid; gap: 8px; justify-items: center;
    }
    .kbd-row{ display: grid; gap: 6px; grid-auto-flow: column; }
    .key{
      background: var(--kbd-bg); color: var(--kbd-text); border: none;
      padding: 12px 10px; border-radius: 6px; font-weight: 700; cursor: pointer;
      min-width: 34px; text-transform: uppercase; user-select: none;
      transition: filter .15s ease, background-color .2s ease;
    }
    .key.wide{ min-width: 64px; }
    .key:active{ filter: brightness(1.2); }
    .toast{
      min-height: 24px; text-align: center; font-weight: 600; color: #fff;
      opacity: .9;
    }
    .footer{
      display: flex; justify-content: center; gap: 10px; align-items: center;
    }
    .btn{
      background: var(--accent); border: none; color: #fff; padding: 8px 12px;
      border-radius: 8px; font-weight: 700; cursor: pointer;
    }
    .help { color: #bbb; font-size: .92rem; text-align: center; line-height: 1.35; }
    a, a:visited { color: #9ecbff; text-decoration: none; }
  </style>
</head>
<body>
  <header>Volapördle</header>

  <main class="game" role="application" aria-label="Word guessing game">
    <div id="toast" class="toast" aria-live="polite"></div>
    <section id="board" class="board" aria-label="Guess board"></section>

    <section class="keyboard" aria-label="On-screen keyboard">
      <div class="kbd-row" id="row1"></div>
      <div class="kbd-row" id="row2"></div>
      <div class="kbd-row" id="row3"></div>
    </section>

    <div class="footer">
      <button id="newGameBtn" class="btn" title="Start a new game">New Game</button>
    </div>
    <p class="help">
      Guess the 5-letter word in 6 tries. Each guess must be a valid 5-letter Volapük word.<br/>
      Hit <b>Enter</b> to submit, <b>Backspace</b> to delete. Colors will show how close you are.
    </p>
  </main>

    ];
    // Allowed guesses (for simplicity, same as solutions + extras)
    const ALLOWED = new Set([
      ...SOLUTIONS
    ]);

    const ROWS = 6;
    const COLS = 5;

    let solution = "";
    let currentRow = 0;
    let currentCol = 0;
    let board = [];     // 6 x 5 letters
    let locked = false; // lock input after win/lose

    const boardEl = document.getElementById("board");
    const toastEl = document.getElementById("toast");
    const newGameBtn = document.getElementById("newGameBtn");

    function randChoice(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

    function initBoard(){
      board = Array.from({length: ROWS}, () => Array(COLS).fill(""));
      boardEl.innerHTML = "";
      for (let r = 0; r < ROWS; r++){
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < COLS; c++){
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${r}-${c}`;
          tile.setAttribute("role","gridcell");
          tile.setAttribute("aria-label", `Row ${r+1} Column ${c+1}`);
          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }
    }

    function setToast(msg, timeout=1400){
      toastEl.textContent = msg;
      if (timeout){
        setTimeout(() => { if (toastEl.textContent === msg) toastEl.textContent = ""; }, timeout);
      }
    }

    // Keyboard rendering
    const ROW1 = "ä e r t y u ü i o ö p".split(" ");
    const ROW2 = "a s d f g h j k l".split(" ");
    const ROW3 = ["Enter"].concat("z x c v b n m".split(" ")).concat(["Back"]);

    const keyState = {}; // letter -> 'correct'|'present'|'wrong'|'absent'

    function makeKey(label, wide=false){
      const btn = document.createElement("button");
      btn.className = "key" + (wide ? " wide" : "");
      btn.textContent = label;
      btn.dataset.key = label.toLowerCase();
      btn.addEventListener("click", () => onKey(label));
      return btn;
    }

    function renderKeyboard(){
      const r1 = document.getElementById("row1");
      const r2 = document.getElementById("row2");
      const r3 = document.getElementById("row3");
      r1.innerHTML = r2.innerHTML = r3.innerHTML = "";

      ROW1.forEach(k => r1.appendChild(makeKey(k)));
      ROW2.forEach(k => r2.appendChild(makeKey(k)));
      ROW3.forEach(k => {
        const wide = (k === "Enter" || k === "Back");
        r3.appendChild(makeKey(k, wide));
      });
      refreshKeyboardColors();
    }

    function refreshKeyboardColors(){
      document.querySelectorAll(".key").forEach(btn => {
        const k = btn.dataset.key;
        btn.style.backgroundColor = ""; // reset
        btn.style.borderColor = "";
        const state = keyState[k];
        if (state === "correct"){ btn.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--correct'); }
        else if (state === "present"){ btn.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--present'); }
		//else if (state === "wrong"){ btn.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--wrong'); }
        else if (state === "absent"){ btn.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--wrong'); }
      });
    }

    function startNewGame(){
      solution = randChoice(SOLUTIONS);
      currentRow = 0;
      currentCol = 0;
      locked = false;
      for (const k in keyState) delete keyState[k];
      initBoard();
      renderKeyboard();
      setToast("New game started!");
      // console.log("Solution:", solution); // Uncomment for debugging
    }

    function onKey(key){
      if (locked) return;
      if (key === "Back" || key === "Backspace"){
        handleBackspace();
      } else if (key === "Enter"){
        submitGuess();
      } else {
        const ch = key.toLowerCase();
        if (/^[a-zäöü]$/.test(ch)){
          handleLetter(ch);
        }
      }
    }

    function handleLetter(ch){
      if (currentCol >= COLS) return;
      board[currentRow][currentCol] = ch;
      const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
      tile.textContent = ch;
      tile.classList.add("filled");
      currentCol++;
    }

    function handleBackspace(){
      if (currentCol === 0) return;
      currentCol--;
      board[currentRow][currentCol] = "";
      const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
      tile.textContent = "";
      tile.classList.remove("filled");
    }

    function submitGuess(){
      if (currentCol < COLS){
        setToast("Not enough letters");
        return;
      }
      const guess = board[currentRow].join("");
      if (!ALLOWED.has(guess)){
        setToast("Not in word list");
        return;
      }
      // Evaluate guess
      const result = evaluateGuess(guess, solution);
      animateReveal(result).then(() => {
        applyKeyboardState(guess, result);
        const isWin = result.every(r => r.state === "correct");
        if (isWin){
          locked = true;
          setToast(`You got it! ${solution.toUpperCase()}`, 4000);
          return;
        }
        currentRow++;
        currentCol = 0;
        if (currentRow >= ROWS){
          locked = true;
          setToast(`The word was ${solution.toUpperCase()}`, 4000);
        }
      });
    }

    // Returns [{letter, state}] each tile; handles duplicates
    function evaluateGuess(guess, answer){
      const res = [];
      const answerArr = answer.split("");
      const guessArr = guess.split("");

      // First pass: mark corrects and count remaining letters in answer
      const remaining = {}; // letter -> remaining count not matched
      for (let i = 0; i < COLS; i++){
        if (guessArr[i] === answerArr[i]){
          res[i] = { letter: guessArr[i], state: "correct" };
          answerArr[i] = null; // consume
        }
      }
      for (let i = 0; i < COLS; i++){
        if (answerArr[i]){
          remaining[answerArr[i]] = (remaining[answerArr[i]] || 0) + 1;
        }
      }
      // Second pass: present/absent
      for (let i = 0; i < COLS; i++){
        if (res[i]) continue;
        const ch = guessArr[i];
        if (remaining[ch] > 0){
          res[i] = { letter: ch, state: "present" };
          remaining[ch]--;
        } else {
          res[i] = { letter: ch, state: "absent" };
        }
      }
      return res;
    }

    function animateReveal(result){
      return new Promise(resolve => {
        const delay = 300;
        result.forEach((r, i) => {
          const tile = document.getElementById(`tile-${currentRow}-${i}`);
          setTimeout(() => {
            tile.classList.add("reveal");
            // after half flip, set color state
            setTimeout(() => {
              tile.classList.add(`state-${r.state}`);
            }, 250);
            if (i === result.length - 1){
              setTimeout(resolve, delay + 220);
            }
          }, i * delay);
        });
      });
    }

    function applyKeyboardState(guess, result){
      for (let i = 0; i < guess.length; i++){
        const ch = guess[i];
        const state = result[i].state;
        // Priority: correct > present > wrong > absent
        const prev = keyState[ch];
        if (prev === "correct") continue;
        if (prev === "present" && state === "absent") continue;
        keyState[ch] = state;
      }
      refreshKeyboardColors();
    }

    // Physical keyboard listeners
    window.addEventListener("keydown", (e) => {
      const key = e.key;
      if (key === "Enter" || key === "Backspace"){
        e.preventDefault();
        onKey(key);
      } else if (/^[a-zA-Z]$/.test(key) && key.length === 1){
        onKey(key);
      }
    });

    newGameBtn.addEventListener("click", startNewGame);

    // Boot
    startNewGame();
  </script>
